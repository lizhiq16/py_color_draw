<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIE 1931 色度图交互分析工具</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #0f172a;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .section-title {
            font-size: 0.88rem;
            font-weight: 600;
            margin: 15px 0 10px 0;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .input-row label {
            font-size: 0.85rem;
            color: #334155;
            white-space: nowrap;
            width: 90px;
        }

        .input-row input {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
        }

        .input-row input:focus {
            border-color: var(--primary-color);
        }

        button, .file-upload-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #0d9488;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-secondary:hover {
            background-color: #0f766e;
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
            width: 100%;
            margin-top: 8px;
            box-sizing: border-box;
        }

        .file-input { display: none; }

        .point-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            margin-top: 10px;
            background: #fafafa;
        }

        .point-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .point-item:last-child { border-bottom: none; }

        .point-item-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow: auto;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .color-preview {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            border: 1px solid rgba(0,0,0,0.2);
            vertical-align: middle;
        }

        .csv-tip {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="panel">
        <h1>CIE 1931 控制台</h1>

        <div class="section-title">1. 图形与坐标系设置</div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="chkShowAxes" checked>
                显示坐标轴及刻度
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="chkShowGrid" checked>
                显示背景网格线
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="chkWavelength" checked>
                绘制光谱波长标注
            </label>
        </div>
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="chkShowPointCoords" checked>
                显示标记点的坐标
            </label>
        </div>

        <!-- ===== 新增：画布与字体大小设置 ===== -->
        <div class="section-title">2. 绘图尺寸与字体设置</div>
        <div class="input-row">
            <label for="numCanvasWidth">画布宽度:</label>
            <input type="number" id="numCanvasWidth" value="800" min="400" max="2400" step="50">
        </div>
        <div class="input-row">
            <label for="numCanvasHeight">画布高度:</label>
            <input type="number" id="numCanvasHeight" value="850" min="400" max="2400" step="50">
        </div>
        <div class="input-row">
            <label for="numTitleFontSize">主标题字体:</label>
            <input type="number" id="numTitleFontSize" value="20" min="10" max="50">
        </div>
        <div class="input-row">
            <label for="numAxisFontSize">坐标轴字体:</label>
            <input type="number" id="numAxisFontSize" value="12" min="8" max="30">
        </div>
        <div class="input-row">
            <label for="numWavelengthFontSize">波长标注:</label>
            <input type="number" id="numWavelengthFontSize" value="10" min="6" max="24">
        </div>
        <div class="input-row">
            <label for="numPointFontSize">标记点字体:</label>
            <input type="number" id="numPointFontSize" value="12" min="8" max="30">
        </div>

        <div class="section-title">3. 标准色域叠加</div>
        <div class="control-group">
            <label class="checkbox-label"><input type="checkbox" id="chkSRGB"> sRGB 色域</label>
        </div>
        <div class="control-group">
            <label class="checkbox-label"><input type="checkbox" id="chkDCI"> DCI-P3 色域</label>
        </div>
        <div class="control-group">
            <label class="checkbox-label"><input type="checkbox" id="chkBT2020"> Rec.2020 色域</label>
        </div>

        <div class="section-title">4. 载入本地光谱 (CSV)</div>
        <label class="file-upload-btn btn-secondary">
            选择并载入 CSV 光谱文件
            <input type="file" id="csvFileInput" class="file-input" accept=".csv">
        </label>
        <div class="csv-tip">格式：CSV 两列（第1列波长nm，第2列强度）。</div>

        <div class="section-title">5. 手动坐标管理</div>
        <div class="input-row">
            <input type="number" id="ptX" placeholder="x (0.0 - 0.8)" step="0.0001" min="0" max="0.8">
            <input type="number" id="ptY" placeholder="y (0.0 - 0.9)" step="0.0001" min="0" max="0.9">
        </div>
        <div class="input-row">
            <input type="text" id="ptLabel" placeholder="标注名称">
        </div>
        <button class="btn-primary" id="btnAddPoint">添加自定义点</button>

        <div class="point-list" id="pointList"></div>
        <button class="btn-danger" id="btnClearPoints">清空所有点</button>
    </div>

    <div class="canvas-container">
        <canvas id="cieCanvas" width="800" height="850"></canvas>
    </div>
</div>

const cmfData = cie1931_1nm.map(d => ({
    wl: d[0],
    x_bar: d[1],
    y_bar: d[2],
    z_bar: d[3]
}));

const locus = cmfData.map(d => {
    const sum = d.x_bar + d.y_bar + d.z_bar;
    return {
        wl: d.wl,
        x: sum > 0 ? d.x_bar / sum : 0.7347,
        y: sum > 0 ? d.y_bar / sum : 0.2653
    };
});

const GAMUTS = {
    srgb: { name: "sRGB", r: [0.64, 0.33], g: [0.30, 0.60], b: [0.15, 0.06], color: "#22c55e" },
    dci: { name: "DCI-P3", r: [0.680, 0.320], g: [0.265, 0.690], b: [0.150, 0.060], color: "#eab308" },
    bt2020: { name: "Rec.2020", r: [0.708, 0.292], g: [0.170, 0.797], b: [0.131, 0.046], color: "#ef4444" }
};

// ================= 2. xy -> sRGB 算法与射线多边形判定 =================
function xyToSRGB(x, y) {
    y = Math.max(y, 1e-10);
    const Y = 1.0;
    const X = (x / y) * Y;
    const Z = ((1.0 - x - y) / y) * Y;

    let r_lin =  3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
    let g_lin = -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z;
    let b_lin =  0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;

    const maxVal = Math.max(r_lin, g_lin, b_lin, 1e-10);
    r_lin = Math.max(r_lin / maxVal, 0);
    g_lin = Math.max(g_lin / maxVal, 0);
    b_lin = Math.max(b_lin / maxVal, 0);

    const gamma = (v) => v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1/2.4) - 0.055;
    
    return [
        Math.round(Math.min(Math.max(gamma(r_lin), 0), 1) * 255),
        Math.round(Math.min(Math.max(gamma(g_lin), 0), 1) * 255),
        Math.round(Math.min(Math.max(gamma(b_lin), 0), 1) * 255)
    ];
}

function isPointInLocus(x, y) {
    if (x < 0 || x > 0.8 || y < 0 || y > 0.9) return false;
    let inside = false;
    for (let i = 0, j = locus.length - 1; i < locus.length; j = i++) {
        const xi = locus[i].x, yi = locus[i].y;
        const xj = locus[j].x, yj = locus[j].y;
        const intersect = ((yi > y) !== (yj > y)) &&
            (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
    }
    return inside;
}

// ================= 3. 画布坐标转换与动态背景缓冲 =================
const canvas = document.getElementById('cieCanvas');
const ctx = canvas.getContext('2d');

let padding = 60;
let scaleX = (canvas.width - 2 * padding) / 0.8;
let scaleY = (canvas.height - 2 * padding) / 0.9;

function updateScale() {
    scaleX = (canvas.width - 2 * padding) / 0.8;
    scaleY = (canvas.height - 2 * padding) / 0.9;
}

function toCanvasX(x) { return padding + x * scaleX; }
function toCanvasY(y) { return canvas.height - padding - y * scaleY; }
function toX(cx) { return (cx - padding) / scaleX; }
function toY(cy) { return (canvas.height - padding - cy) / scaleY; }

let customPoints = [
    { x: 0.3127, y: 0.3290, label: 'D65 White' },
    { x: 0.4500, y: 0.4100, label: 'Test Point 1' }
];

let bgCanvas = document.createElement('canvas');
let bgCtx = bgCanvas.getContext('2d');

function renderBackground() {
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;

    const imgData = bgCtx.createImageData(canvas.width, canvas.height);
    const data = imgData.data;

    for (let py = 0; py < canvas.height; py++) {
        const y = toY(py);
        for (let px = 0; px < canvas.width; px++) {
            const x = toX(px);
            const idx = (py * canvas.width + px) * 4;

            if (isPointInLocus(x, y)) {
                const [r, g, b] = xyToSRGB(x, y);
                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255;
            } else {
                data[idx + 3] = 0;
            }
        }
    }
    bgCtx.putImageData(imgData, 0, 0);
}

renderBackground();

// ================= 4. 主渲染函数 =================
function draw() {
    // 获取字体配置
    const titleFontSize = parseInt(document.getElementById('numTitleFontSize').value) || 20;
    const axisFontSize = parseInt(document.getElementById('numAxisFontSize').value) || 12;
    const wavelengthFontSize = parseInt(document.getElementById('numWavelengthFontSize').value) || 10;
    const pointFontSize = parseInt(document.getElementById('numPointFontSize').value) || 12;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. 绘制色彩背景
    ctx.drawImage(bgCanvas, 0, 0);

    // 绘制主标题
    ctx.fillStyle = '#0f172a';
    ctx.font = `bold ${titleFontSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('CIE 1931 Chromaticity Diagram', canvas.width / 2, padding / 2 + titleFontSize / 3);

    const showGrid = document.getElementById('chkShowGrid').checked;
    const showAxes = document.getElementById('chkShowAxes').checked;

    // 2. 网格线
    if (showGrid) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = '#e2e8f0';
        for (let x = 0.1; x <= 0.8; x += 0.1) {
            const cx = toCanvasX(x);
            ctx.beginPath();
            ctx.moveTo(cx, padding);
            ctx.lineTo(cx, canvas.height - padding);
            ctx.stroke();
        }
        for (let y = 0.1; y <= 0.9; y += 0.1) {
            const cy = toCanvasY(y);
            ctx.beginPath();
            ctx.moveTo(padding, cy);
            ctx.lineTo(canvas.width - padding, cy);
            ctx.stroke();
        }
    }

    // 3. 坐标轴及文字标题
    if (showAxes) {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.strokeRect(padding, padding, canvas.width - 2 * padding, canvas.height - 2 * padding);

        ctx.fillStyle = '#334155';
        ctx.font = `${axisFontSize}px sans-serif`;
        ctx.textAlign = 'center';
        
        // X轴刻度
        for (let x = 0; x <= 0.8; x += 0.1) {
            const cx = toCanvasX(x);
            ctx.fillText(x.toFixed(1), cx, canvas.height - padding + axisFontSize + 4);
        }
        // Y轴刻度
        ctx.textAlign = 'right';
        for (let y = 0; y <= 0.9; y += 0.1) {
            const cy = toCanvasY(y);
            ctx.fillText(y.toFixed(1), padding - 8, cy + axisFontSize / 3);
        }

        // X 轴标题 (x)
        ctx.fillStyle = '#0f172a';
        ctx.font = `bold ${axisFontSize + 4}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('x', canvas.width / 2, canvas.height - 10);

        // Y 轴标题 (y)
        ctx.save();
        ctx.translate(20, canvas.height / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('y', 0, 0);
        ctx.restore();
    }

    // 4. 色度图轮廓线
    ctx.beginPath();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;

    locus.forEach((pt, i) => {
        const cx = toCanvasX(pt.x);
        const cy = toCanvasY(pt.y);
        if (i === 0) ctx.moveTo(cx, cy);
        else ctx.lineTo(cx, cy);
    });

    ctx.closePath();
    ctx.stroke();

    // 5. 波长刻度标注
    if (document.getElementById('chkWavelength').checked) {
        const targetWls = [450, 460, 470, 480, 490, 500, 510, 520, 530, 540, 550, 560, 570, 580, 590, 600, 620, 630, 650, 700];
        ctx.fillStyle = '#000000';
        ctx.font = `${wavelengthFontSize}px monospace`;
        ctx.textAlign = 'left';

        locus.forEach((pt) => {
            if (targetWls.includes(pt.wl)) {
                const cx = toCanvasX(pt.x);
                const cy = toCanvasY(pt.y);

                ctx.beginPath();
                ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                ctx.fill();

                let offsetX = 8, offsetY = -4;
                if (pt.wl >= 520 && pt.wl <= 560) { offsetY = -10; offsetX = -10; }
                if (pt.wl >= 460 && pt.wl <= 480) offsetX = -35;

                ctx.fillText(`${pt.wl}nm`, cx + offsetX, cy + offsetY);
            }
        });
    }

    // 6. 色域覆盖三角形
    const drawGamut = (gamutKey, elId) => {
        if (document.getElementById(elId).checked) {
            const g = GAMUTS[gamutKey];
            const rx = toCanvasX(g.r[0]), ry = toCanvasY(g.r[1]);
            const gx = toCanvasX(g.g[0]), gy = toCanvasY(g.g[1]);
            const bx = toCanvasX(g.b[0]), by = toCanvasY(g.b[1]);

            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(gx, gy);
            ctx.lineTo(bx, by);
            ctx.closePath();

            ctx.strokeStyle = g.color;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = g.color + "22";
            ctx.fill();
        }
    };

    drawGamut('srgb', 'chkSRGB');
    drawGamut('dci', 'chkDCI');
    drawGamut('bt2020', 'chkBT2020');

    // 7. 手动标注点绘制
    const showPointCoords = document.getElementById('chkShowPointCoords').checked;

    customPoints.forEach((pt) => {
        const cx = toCanvasX(pt.x);
        const cy = toCanvasY(pt.y);

        ctx.beginPath();
        ctx.arc(cx, cy, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = `bold ${pointFontSize}px sans-serif`;
        ctx.textAlign = 'left';

        let labelText = pt.label || '';
        if (showPointCoords) {
            const coordsStr = `(${pt.x.toFixed(4)}, ${pt.y.toFixed(4)})`;
            labelText = labelText ? `${labelText} ${coordsStr}` : coordsStr;
        }

        if (labelText) {
            ctx.fillText(labelText, cx + 8, cy - 8);
        }
    });
}

document.getElementById('csvFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
        parseSpectrumCSV(evt.target.result, file.name);
    };
    reader.readAsText(file);
});

function parseSpectrumCSV(csvText, filename) {
    const lines = csvText.split(/\r\n|\n/);
    const spectrum = {};

    lines.forEach(line => {
        const parts = line.trim().split(/[,; \t]+/);
        if (parts.length >= 2) {
            const wl = parseFloat(parts[0]);
            const val = parseFloat(parts[1]);
            if (!isNaN(wl) && !isNaN(val)) {
                spectrum[Math.round(wl)] = val;
            }
        }
    });

    let X = 0, Y = 0, Z = 0, count = 0;
    cmfData.forEach(entry => {
        const wl = entry.wl;
        const P = spectrum[wl] || 0;
        if (spectrum[wl] !== undefined) count++;

        X += P * entry.x_bar;
        Y += P * entry.y_bar;
        Z += P * entry.z_bar;
    });

    if (count === 0 || (X + Y + Z) === 0) {
        alert("未能识别到有效波长数据，请确保 CSV 第一列为 360-770nm 波长，第二列为相对强度。");
        return;
    }

    const sum = X + Y + Z;
    const x = X / sum;
    const y = Y / sum;

    const labelName = filename.replace(/\.[^/.]+$/, "");
    customPoints.push({
        x: parseFloat(x.toFixed(4)),
        y: parseFloat(y.toFixed(4)),
        label: labelName
    });

    updatePointListUI();
    draw();
    alert(`成功载入 [${labelName}]！计算结果: x = ${x.toFixed(4)}, y = ${y.toFixed(4)}`);
}

// ================= 6. UI 联动与事件响应 =================
function updatePointListUI() {
    const listEl = document.getElementById('pointList');
    listEl.innerHTML = '';

    customPoints.forEach((pt, idx) => {
        const [r, g, b] = xyToSRGB(pt.x, pt.y);
        const item = document.createElement('div');
        item.className = 'point-item';
        item.innerHTML = `
            <span>
                <span class="color-preview" style="background-color: rgb(${r},${g},${b});"></span>
                <strong>${pt.label || 'Point ' + (idx + 1)}</strong> (${pt.x.toFixed(4)}, ${pt.y.toFixed(4)})
            </span>
            <button class="point-item-btn" onclick="deletePoint(${idx})">删除</button>
        `;
        listEl.appendChild(item);
    });
}

function deletePoint(index) {
    customPoints.splice(index, 1);
    updatePointListUI();
    draw();
}

    const label = labelInput.value.trim();

    if (isNaN(x) || isNaN(y) || x < 0 || x > 0.8 || y < 0 || y > 0.9) {
        alert('请输入正确的 x (0.0 - 0.8) 和 y (0.0 - 0.9) 坐标范围！');
        return;
    }

    customPoints.push({ x, y, label });
    updatePointListUI();
    draw();

    xInput.value = '';
    yInput.value = '';
    labelInput.value = '';
});

document.getElementById('btnClearPoints').addEventListener('click', function() {
    customPoints = [];
    updatePointListUI();
    draw();
});

// 监听控制开关变化并重绘 Canvas
[
    'chkShowAxes', 
    'chkShowGrid', 
    'chkWavelength', 
    'chkShowPointCoords', 
    'chkSRGB', 
    'chkDCI', 
    'chkBT2020',
    'numTitleFontSize',
    'numAxisFontSize',
    'numWavelengthFontSize',
    'numPointFontSize'
].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
    document.getElementById(id).addEventListener('change', draw);
});

// 监听画布高宽变化，重新计算尺寸并重绘色彩背景
function handleCanvasResize() {
    const w = parseInt(document.getElementById('numCanvasWidth').value) || 800;
    const h = parseInt(document.getElementById('numCanvasHeight').value) || 850;

    canvas.width = w;
    canvas.height = h;

    updateScale();
    renderBackground();
    draw();
}

document.getElementById('numCanvasWidth').addEventListener('change', handleCanvasResize);
document.getElementById('numCanvasHeight').addEventListener('change', handleCanvasResize);

// 初始化渲染
updatePointListUI();
draw();
</script>
</body>
</html>
